# r17: floor 3, seq 17. See design/pillars.md (difficulty curve) and docs/engine_notes.md section 11 (AI rules).
id: r17
status: specified
seq: 17
floor: 3
teaches: >-
  Three tools in a row: time a lane crossing, sleep a guard from far away along a hall, then
  ambush a patrol inside your own smoke.
layout: >-
  Stacked bands, no lit rooms. South hall (rows 10-12): start (3,12). Wall row 9 (gap cols 3-4),
  patrol lane row 8 (guard a), wall row 7 (gap cols 3-4), a two-row middle hall (rows 5-6) with
  a still guard c at (9,5) looking west, wall row 4 (gap at col 14 only) and a one-cell top
  corridor (row 3, cols 1-14) with a patrolling guard b; the exit is the west end of that
  corridor (1,3).
grid:
  - "################"
  - "################"
  - "################"
  - "#X.b...........#"
  - "##############.#"
  - "#........c.....#"
  - "#..............#"
  - "###..###########"
  - "#...........a..#"
  - "###..###########"
  - "#..............#"
  - "#..............#"
  - "#..S...........#"
  - "################"
lighting: dark

guards:
  - type: lantern_guard
    patrol: >-
      Lane (row 8): walks east-west along cols 1-14, starting at (12,8) facing west; pauses
      about 1 s at each wall.
    facing: left
    id: a
    move: patrol
  - type: lantern_guard
    patrol: >-
      Top corridor (row 3): walks east-west along cols 1-14, starting at (3,3) facing west;
      pauses about 1 s at each end wall.
    facing: left
    id: b
    move: patrol
  - type: lantern_guard
    patrol: >-
      Middle hall: stands still at (9,5) facing west; sees 5 cells (cols 4-8, rows 5-6 and a
      little beyond).
    facing: left
    id: c
    move: still

tools_given: []

intended_solution: >-
  1. At the start (3,12), directly below the south gap (the wall hides you from lane guard a),
  wait for a clear lane: either guard a is still 8 or more cells east of col 3 and walking west
  (you have about 1.5 s: go at once), or he has walked past col 7 going east (his back to the
  gap). Go straight up col 3 across the lane to (3,6) in the middle hall. 2. You are 6 cells
  from c, outside his 5-cell sight and in line with him: step to (3,5), face east and fire a
  dart: c sleeps for 8 s. 3. Walk east along row 6 to (10,6) (c is asleep) and wait there until
  guard b, in the top corridor, is walking west and has passed col 9; then go east to (14,6) and
  up to (14,4), the shaft cell below the corridor's east end. 4. Wait there, facing north, until
  b has turned at the west wall and starts walking east again; then place an Ink Pot (it goes
  down at (14,3), smoke after 2.5 s, 5 s long). 5. When the smoke is up (about 3 s) step into it
  at (14,3), face west (tap left) and wait for b to walk up to you: when he is 1-1.5 cells away
  press B (Shade Knife). 6. Walk west along the corridor to the exit (1,3).
solution_inputs: tests/solutions/r17.inputs
par_time_sec: 45
ghost_possible: false

must_not:
  - "Crossing lane 8 while a is within 5 cells of the gap and facing it must get you Suspicious."
  - "Walking east along the middle hall past col 4 before sleeping c must get you Suspicious."
  - "Stabbing b after he has become Suspicious must not kill him."
  - "Standing at (14,3)/(14,4) when b has walked within 5 cells without smoke must get you Suspicious."
