# r14: floor 2, seq 14. See design/pillars.md (difficulty curve) and docs/engine_notes.md section 11 (AI rules).
id: r14
status: specified
seq: 14
floor: 2
teaches: >-
  Floor 2 exam (lit): sleep a guard from beyond his 8-cell sight, time a patrol, and drop smoke
  to cross a corridor watched from both ends.
layout: >-
  LIT. Three bands. South hall (rows 6-12), split by a wall at col 6 (rows 6-12) with a one-cell
  door at (6,9): the west side (cols 1-5) holds your start (1,9) and a patrolling guard b who
  walks up and down col 5 (rows 6-12); the east side (cols 7-14) holds a still guard a at (13,9)
  looking west at the door, and a pillar at (9,6). A wall (row 5) with a two-cell gap at cols
  7-8 leads to a one-cell corridor (row 4) with a still guard at each end (c at (1,4) facing
  east, d at (14,4) facing west). Another wall (row 3) with a gap at cols 7-8 leads to the exit
  row (7-8, row 2).
grid:
  - "################"
  - "################"
  - "#......XX......#"
  - "#######..#######"
  - "#c............d#"
  - "#######..#######"
  - "#.....#..p.....#"
  - "#.....#........#"
  - "#.....#........#"
  - "#S...........a.#"
  - "#.....#........#"
  - "#.....#........#"
  - "#....b#........#"
  - "################"
lighting: lit

guards:
  - type: lantern_guard
    patrol: >-
      South hall: stands still at (13,9) facing west; sees 8 cells (to col 5 along row 9). Out
      of his sight from col 4 and below, row 9.
    facing: left
    id: a
    move: still
  - type: lantern_guard
    patrol: >-
      South hall: walks up and down col 5 (rows 6-12), starting at (5,12) facing north; pauses
      about 1 s at each end and turns round.
    facing: up
    id: b
    move: patrol
  - type: lantern_guard
    patrol: >-
      Corridor west end (1,4), facing east; sees 8 cells (to col 9).
    facing: right
    id: c
    move: still
  - type: lantern_guard
    patrol: >-
      Corridor east end (14,4), facing west; sees 8 cells (to col 6).
    facing: left
    id: d
    move: still

tools_given: []

intended_solution: >-
  1. You start at (1,9), a spot where b can never see you (he is 4 cols away and his lane
  reaches only 3 rows either side of row 9) and a is 12 cells away. Face east and fire a dart
  along row 9 when b is not on row 9 (a dart that hits b would only put b to sleep: fine too,
  but then fire again): a sleeps for about 8 s. 2. Cross b's lane at (5,9) and go through the
  door (6,9) only while b is walking away from row 9 (up above row 8 with his back to you, or
  down below row 10), then go east to (7,9) and north up col 7 to (7,6): the wall (col 6) hides
  you from b. Guard a sleeps for about 8 s, but the pillar at (9,6) hides the gap cells from him
  even after he wakes. 3. Step up through the gap to (7,5) (a gap cell, hidden from c and d by
  the wall corners, from b by the wall and from a by the pillar), face north and place an Ink
  Pot. 4. Wait about 3 s for the smoke, then walk (7,4) -> (7,3) -> (7,2): the exit row. The
  smoke hides you from both corridor guards.
solution_inputs: tests/solutions/r14.inputs
par_time_sec: 45
ghost_possible: false

must_not:
  - "Walking east along row 9 without sleeping a must get you Suspicious once you are within 8 cells of him (col 5)."
  - "Standing at (1,9) must NOT get you seen by a or b."
  - "Crossing the corridor (7,4)/(8,4) without smoke must get you Suspicious from c and d."
  - "Standing at (7,5) while waiting for the smoke must NOT get you seen by b, c or d."
