tools_given: []

intended_solution: >-
  1. Start (1,11): step to (1,10), face east and fire a dart along row 10: a sleeps. Step to
  (1,12), fire along row 12: b sleeps. (Both are 12 cells away, outside the 8-cell lit sight;
  stay in cols 1-4 until both sleep.) 2. Walk east along row 11 to (8,11) (both guards are
  asleep for 8 s) and wait just below the gap (cols 8-9) for a clear lane: guard c more than 8
  cells off or with his back to the gap. Go straight up col 8 across the lane to (8,6), the safe
  hall row. 3. Step up to (8,5), the gap cell below the top corridor (hidden from d and e by the
  wall corners), face north and place an Ink Pot. 4. Wait about 3 s for the smoke, then walk
  north through the smoke (8,4), (8,3) to the exit (8,2). If a and b wake before you leave the
  south hall, go back and re-dart them (8 darts).
solution_inputs: tests/solutions/r20.inputs
par_time_sec: 50
ghost_possible: false

must_not:
  - "Walking east along rows 10-12 past col 4 before the corresponding guard sleeps must get you Suspicious (lit range 8)."
  - "Crossing the lane while c is within 8 cells of cols 8-9 and facing them must get you Suspicious."
  - "Crossing the top corridor without smoke must get you Suspicious from d and e."
  - "Waiting at (8,5) for the smoke must NOT get you seen by c, d or e."
