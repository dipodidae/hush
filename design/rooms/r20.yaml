# r20: floor 3, seq 20. See design/pillars.md (difficulty curve) and docs/engine_notes.md section 11 (AI rules).
id: r20
status: specified
seq: 20
floor: 3
teaches: >-
  Last rehearsal (lit): sleep two guards from far away, time a lane, and drop smoke across a
  corridor; nothing new, only more of it.
layout: >-
  LIT, five guards, stacked bands. South hall (rows 10-12, you start at (1,11)): two still
  guards stand at the east wall looking west, a at (13,10) and b at (13,12), covering the hall
  from col 5. Wall row 9 (gap cols 8-9), patrol lane row 8 (guard c), wall row 7 (gap cols 8-9),
  a one-cell safe hall row (row 6), wall row 5 (gap cols 8-9), top corridor (row 4) with a still
  guard at each end (d at (1,4) facing east, e at (14,4) facing west), wall row 3 (gap cols
  8-9), exit (8,2)-(9,2).
