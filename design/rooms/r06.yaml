# r06: floor 1, seq 6. See design/pillars.md (difficulty curve) and docs/engine_notes.md section 11 (AI rules).
id: r06
status: specified
seq: 6
floor: 1
teaches: >-
  Floor 1 exam: ambush a patrol, stab a guard from behind, and time a crossing, in one snaking
  route.
layout: >-
  A snake in three bands. Bottom band: a one-cell corridor (row 12, cols 1-14) with a deep two-
  cell pocket above it at col 4 (rows 10-11, you start in its mouth at (4,11)) and a shallow
  decoy pocket at (10,11); a patrolling guard walks it. A shaft at col 14 (rows 8-11) leads up
  to the middle corridor (row 7), where a still guard stands at (7,7) facing west with his back
  to the shaft. A one-cell gap at (1,6) leads up into the top hall (rows 2-5, cols 1-14), where
  a guard patrols up and down col 8; the exit is on the east wall (14,4)-(14,5).
grid:
  - "################"
  - "################"
  - "#.......a......#"
  - "#..............#"
  - "#.............X#"
  - "#.............X#"
  - "#.##############"
  - "#......b.......#"
  - "##############.#"
  - "##############.#"
  - "####.#########.#"
  - "####S#####.###.#"
  - "#............c.#"
  - "################"
lighting: dark

guards:
  - type: lantern_guard
    patrol: >-
      Top hall: walks up and down col 8 between rows 2 and 5, starting at (8,2) facing down;
      pauses about 1 s at each end and turns round.
    facing: down
    id: a
    move: patrol
  - type: lantern_guard
    patrol: >-
      Middle corridor: stands still at (7,7) facing west, back to the shaft you arrive by.
    facing: left
    id: b
    move: still
  - type: lantern_guard
    patrol: >-
      Bottom corridor: walks west along row 12 from (13,12) to the west wall, pauses about 1 s,
      then walks back east; repeats.
    facing: left
    id: c
    move: patrol

tools_given: []

intended_solution: >-
  1. Bottom band: within about 2.5 s step from the start (4,11) to the pocket bottom (4,10) and
  wait while guard c walks west past you (about 3 s). When he is past col 3 with his back to
  you, follow him west; he pauses at the west wall, so walk up to 1 cell behind him and press B.
  2. Walk east along row 12 to (14,12), north up the col-14 shaft to (14,7). 3. Walk west along
  row 7 behind guard b (back to you) to about 1.5 cells from him and press B. Continue west to
  (1,7), then north through the gap (1,6) to (1,5). 4. Top hall: wait at (5,5) until guard a is
  walking up col 8 (back to you) and is above row 4, then walk east along row 5 to the exit
  (14,5) before he turns round.
solution_inputs: tests/solutions/r06.inputs
par_time_sec: 25
ghost_possible: false

must_not:
  - "Walking down the bottom corridor towards guard c must get you Suspicious: you cannot pass him without the ambush."
  - "The shallow decoy pocket at (10,11) is not a hiding place: guard c sees one cell off the corridor."
  - "Guard b must not notice you walking up behind him along row 7."
  - "Crossing col 8 in the top hall while guard a faces down (or is within 1 cell of your row) must get you Suspicious or a catch."
  - "Using no kill at all must be impossible (ghost_possible false): c blocks row 12 and b blocks row 7."
