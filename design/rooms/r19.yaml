# r19: floor 3, seq 19. See design/pillars.md (difficulty curve) and docs/engine_notes.md section 11 (AI rules).
id: r19
status: specified
seq: 19
floor: 3
teaches: >-
  Everything in a row, in the dark: cross a lane with two patrols, stab a guard from behind,
  ambush a patrol in your own smoke.
layout: >-
  Stacked bands (the mirror of the r17 stack, exit in the east): south hall (rows 10-12, start
  (12,12)); wall row 9 (gap cols 11-12); lane row 8 with two patrols walking towards and past
  each other; wall row 7 (gap cols 11-12); two-row middle hall (rows 5-6) with a still guard c
  at (6,5) facing west; wall row 4 (gap at col 1 only); one-cell top corridor (row 3, cols 1-14)
  with a patrol b; the exit is its east end (14,3).
grid:
  - "################"
  - "################"
  - "################"
  - "#...........b.X#"
  - "#.##############"
  - "#.....c........#"
  - "#..............#"
  - "###########..###"
  - "#..a.........e.#"
  - "###########..###"
  - "#..............#"
  - "#..............#"
  - "#...........S..#"
  - "################"
lighting: dark

guards:
  - type: lantern_guard
    patrol: >-
      Lane (row 8): walks east-west along cols 1-14, starting at (3,8) facing east; pauses about
      1 s at each end wall.
    facing: right
    id: a
    move: patrol
  - type: lantern_guard
    patrol: >-
      Lane (row 8): walks east-west along cols 1-14, starting at (13,8) facing west; pauses
      about 1 s at each end wall. He and a cross in the middle of the lane.
    facing: left
    id: e
    move: patrol
  - type: lantern_guard
    patrol: >-
      Middle hall: stands still at (6,5) facing west, back to the lane gap you arrive by; sees 5
      cells (cols 1-5).
    facing: left
    id: c
    move: still
  - type: lantern_guard
    patrol: >-
      Top corridor (row 3): walks east-west along cols 1-14, starting at (12,3) facing east;
      pauses about 1 s at each end wall.
    facing: right
    id: b
    move: patrol

tools_given: []

intended_solution: >-
  1. Start (12,12), below the south gap (cols 11-12). Wait for a clear lane: the two patrols
  cross each other and both walk away from the gap after that; when neither can see the gap
  (each is either facing away or more than 5 cells off), go straight up col 12 across the lane
  to (12,6). 2. Walk west along row 5 behind guard c (his back is to you) to 1-1.5 cells from
  him and press B (Shade Knife). 3. Continue west to (1,5) and wait there until b has walked
  past col 3 heading east (his back to you), then step up to (1,4), the shaft cell below the
  corridor's west end. Wait there, facing north, until b is near the east wall, then place an
  Ink Pot. 4. When the smoke is up (3 s) step up to (1,3), face east (tap right) and wait for b
  to walk up to you; at 1-1.5 cells press B. 5. Walk east along the corridor to the exit (14,3).
solution_inputs: tests/solutions/r19.inputs
par_time_sec: 60
ghost_possible: false

must_not:
  - "Crossing the lane while either patrol is within 5 cells of cols 11-12 and facing them must get you Suspicious."
  - "Walking along the middle hall west of col 6 without killing c must get you Suspicious."
  - "Stabbing c or b once he is Suspicious must not kill him."
  - "Standing at (1,3)/(1,4) when b walks within 5 cells without smoke must get you Suspicious."
