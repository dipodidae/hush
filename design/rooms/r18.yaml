# r18: floor 3, seq 18. See design/pillars.md (difficulty curve) and docs/engine_notes.md section 11 (AI rules).
id: r18
status: specified
seq: 18
floor: 3
teaches: >-
  Lit combination: choose one of two guarded doors, sleep its guard from beyond 8 cells, then
  cross a lit patrol lane behind his back.
layout: >-
  LIT. A wall at col 9 has two one-cell doors, at rows 4 and 10. Behind each door, 4 cells in, a
  still guard faces west: a at (13,4), b at (13,10). The east hall (cols 10-14) is also cut by a
  patrol lane: guard c walks up and down col 12 (rows 2-12). You start in the west hall at
  (1,7); the exit is two cells in the east wall, (14,7)-(14,8).
