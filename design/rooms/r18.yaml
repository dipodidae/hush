guards:
  - type: lantern_guard
    patrol: >-
      Stands still at (13,4) facing west at the north door (9,4); sees 8 cells (to col 5 along
      row 4).
    facing: left
    id: a
    move: still
  - type: lantern_guard
    patrol: >-
      Stands still at (13,10) facing west at the south door (9,10); sees 8 cells (to col 5 along
