    facing: down
    id: c
    move: patrol

tools_given: []

intended_solution: >-
  1. Pick the south door. Walk to (3,10) (3 cells from the wall; 10 cells from guard b, outside
  his 8-cell sight), face east and fire a dart through the door (9,10) (fire when c is walking
  south in the upper half of his lane, so that he cannot be on row 10 when the dart flies; if
  c's body stops the dart he sleeps instead: wait and fire again): b sleeps for 8 s. (The north
  door works the same way from (3,4) with guard a.) 2. Wait at (8,10), right behind the wall
  (the wall hides you from c), until c has gone to the south end of his lane, turned, and is
  walking north (his back to you) above row 9; this takes about 4 s, inside b's 8 s of sleep. 3.
  Then go through the door (9,10) to (10,10), north up col 10 to (10,8) and east along row 8
  across c's lane to the exit (14,8). (Do not step on (10,7): guard a, awake at (13,4), sees it
  along the diagonal.) You move away from c all the way and he does not turn before you cross
  (he pauses at the north wall for about 1 s).
solution_inputs: tests/solutions/r18.inputs
par_time_sec: 40
ghost_possible: false

must_not:
  - "Walking up to either door from col 5 or further east before its guard sleeps must get you Suspicious (lit range 8)."
  - "Standing at (3,4), (3,7) or (3,10) must NOT get you seen (10 cells from the nearest guard; the wall blocks c)."
  - "Crossing col 12 while c is facing the crossing row from within 8 rows must get you Suspicious."
  - "Waiting in the east hall (col 10 or beyond) in line with c's lane within 8 rows of him, facing you, must get you Suspicious."
