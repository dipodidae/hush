# r16: floor 3, seq 16. See design/pillars.md (difficulty curve) and docs/engine_notes.md section 11 (AI rules).
id: r16
status: specified
seq: 16
floor: 3
teaches: >-
  Lit combination: two darts from beyond 8 cells (along a row and up a column through a door),
  then cross a patrol lane behind the patrol's back.
layout: >-
  LIT. A wall across row 8 has a single one-cell door at col 7. South hall (rows 9-12): you
  start at (1,10) facing east; a still guard c stands at (13,10) looking west along row 10.
  North hall (rows 2-7): a still guard a stands at (7,2) looking down at the door (7,8), 6 rows
  above it; a patrol b walks east-west along row 5 and so cuts the north hall in two; the exit
  is the north-east corner (13,2)-(14,2).
grid:
  - "################"
  - "################"
  - "#......a.....XX#"
  - "#..............#"
  - "#..............#"
  - "#..b...........#"
  - "#..............#"
  - "#..............#"
  - "#######.########"
  - "#..............#"
  - "#S...........c.#"
  - "#..............#"
  - "#..............#"
  - "################"
lighting: lit

guards:
  - type: lantern_guard
    patrol: >-
      North hall: stands still at (7,2) facing south down col 7; sees 8 cells (down to row 10
      along col 7).
    facing: down
    id: a
    move: still
  - type: lantern_guard
    patrol: >-
      North hall: walks east-west along row 5 (cols 1-14), starting at (3,5) facing east; pauses
      about 1 s at each end wall.
    facing: right
    id: b
    move: patrol
  - type: lantern_guard
    patrol: >-
      South hall: stands still at (13,10) facing west along row 10; sees 8 cells (to col 5).
    facing: left
    id: c
    move: still

tools_given: []

intended_solution: >-
  1. Stay at the start (1,10), out of sight of everyone, and watch the north hall's patrol b
  only through the timing (he reaches the east wall about 5 s after you start and turns back
  west). When he turns, face east and fire a dart along row 10: c, 12 cells away, sleeps for 8
  s. 2. Step down to row 11 and walk east along row 11 to (7,11) (do not enter (7,10): that cell
  is 8 rows below a and in his sight): you are 9 rows below guard a, outside his 8-cell sight,
  in line with him through the door. Face north. 3. Wait for b to walk west past col 8 (his back
  is to the east side where you are headed): fire a dart up the column (if b happens to cross
  col 7 at that moment his body stops the dart, wait and fire again): a sleeps. 4. At once go up
  through the door (7,8) to (7,7), east along row 7 to (13,7), north across his lane (he is west
  of you, facing west, 8+ cells away) to (13,2): the exit. The dash takes about 4 s; both
  sleepers stay asleep for 8 s. If c wakes before you finish, go back to (1,10) and re-dart him
  (8 darts).
solution_inputs: tests/solutions/r16.inputs
par_time_sec: 40
ghost_possible: false

must_not:
  - "Walking east along row 10 before sleeping c must get you Suspicious (lit range 8) from col 5."
  - "Standing at (7,10) or higher in col 7 before sleeping a must get you Suspicious from a (his sight reaches row 10)."
  - "Crossing b's lane while he is facing you from within 8 cells must get you Suspicious."
  - "Waiting south of the wall (row 9 or lower) must NOT get you seen by b or a (the wall blocks the line)."
