tools_given: []

intended_solution: >-
  1. Start (14,11), 12 cells from guard a: when guard f is not on row 11 (his body would stop
  the dart), face west and fire a dart along row 11 through the door (7,11): a sleeps. 2. Go
  through the door only while f is at one end of his lane or walking away from row 11, pass his
  lane at (6,11) and walk on to (3,12) (guard f's cone is vertical: (3,12) is out of it). 3.
  Wait there below the lane gap (cols 3-4) for a clear lane: guard b either more than 8 cells
  away or with his back to the gap; then go straight up col 3 across the lane to (3,6) at the
  west end of the middle corridor, 11 cells from guard c. 4. Face east and fire a dart along the
  corridor: c sleeps. 5. Walk east along the corridor to (8,6) and up to (8,5), the gap cell
  below the top corridor (hidden from d and e by the wall corners). Face north and place an Ink
  Pot. 6. Wait about 3 s for the smoke, then walk north through the smoke (8,4), (8,3) to the
  exit (8,2). Darts spent: 2 (of 8); pots: 1.
solution_inputs: tests/solutions/final.inputs
par_time_sec: 75
ghost_possible: false

must_not:
  - "Walking west along row 11 past col 10 before sleeping a must get you Suspicious (lit range 8)."
  - "Crossing the lane while b is within 8 cells of cols 3-4 and facing them must get you Suspicious."
  - "Standing in the middle corridor at col 6 or more before sleeping c must get you Suspicious."
  - "Crossing the top corridor without smoke must get you Suspicious from d and e."
  - "Waiting at (8,5) for the smoke must NOT get you seen by d, e or c (asleep)."
  - "Waiting at (3,12) must NOT get you seen by f (his cone is vertical, 3 cols away)."
