# final: floor 3, seq 21. See design/pillars.md (difficulty curve) and docs/engine_notes.md section 11 (AI rules).
id: final
status: specified
seq: 21
floor: 3
teaches: >-
  The heist: every tool and every rule on one screen, six guards: a dart through a door, a
  patrol in a short lane, a lit patrol lane, a second dart along a corridor, and a smoke screen
  across a corridor watched from both ends.
layout: >-
  LIT, six guards, five stacked bands (bottom to top). South hall (rows 10-12): you start at the
  east end (14,11); a wall at col 7 has a one-cell door at (7,11); west of it a patrol f walks
  up and down col 6 (rows 10-12) and, at the far west, a still guard a at (2,11) looks east at
  the door. Wall row 9 (gap cols 3-4), patrol lane row 8 (guard b), wall row 7 (gap cols 3-4).
  One-cell middle corridor (row 6) with a still guard c at its east end (14,6) looking west.
  Wall row 5 (gap cols 8-9). Top corridor (row 4) with a still guard at each end (d at (1,4)
  facing east, e at (14,4) facing west). Wall row 3 (gap cols 8-9). The exit is the vault row at
  the top (8,2)-(9,2).
