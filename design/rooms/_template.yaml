# Room spec template. Copy to design/rooms/<id>.yaml (id must equal the file name).
# Specs change BEFORE code. `make validate` checks this schema.
# Files starting with "_" are templates and are not validated as rooms.

id: r01                      # [a-z0-9_]+, must equal the file name stem
status: draft                # draft | specified | built
                             #   built => solution_inputs must exist on disk
seq: 1                       # play order, 1..N unique and contiguous over all rooms; last = final heist room
floor: 1                     # 1..3 (the final heist room is floor 3, id "final")
teaches: >-                  # the ONE idea this room teaches
  One sentence.
layout: >-                   # prose: walls, cover, exits, where Link enters, one screen
  Describe the single-screen layout.
grid:                        # exactly 14 rows x 16 chars; one char = one 16x16 px cell of the visible
                             # 256x224 window. QUOTE every row (a bare # starts a YAML comment).
                             #   #  solid wall      .  floor        S  player start (exactly one)
                             #   X  exit cell (>=1; touching any X ends the room)
                             #   p  pillar / cover (solid, same as #, may be drawn differently)
                             #   a-h  a guard standing on floor (each letter at most once; must match guards[].id)
                             #   PROPOSED in design/tiles.md (not valid until approved + validate_specs updated):
                             #   D  doorway (walkable)   O  pit (solid, visual)   W  water (solid, visual)
                             # Rows 0,1 (hidden under the HUD) and 13, columns 0 and 15 must be all #.
  - "################"
  - "################"
  - "#..............#"
  - "#S.............#"
  - "#..............#"
  - "#.....a........#"
  - "#..............#"
  - "#..............#"
  - "#..............#"
  - "#..............#"
  - "#.............X#"
  - "#..............#"
  - "#..............#"
  - "################"
lighting: dark               # lit | dark  (lit = larger guard detection range)

guards:                      # may be empty
  - type: lantern_guard      # guard kind (free text; keep names consistent across rooms)
    patrol: >-               # prose or list of tile waypoints, e.g. [[4,3],[10,3]]
      Walks left-right along the north wall, pauses 1s at each end.
    facing: down             # up | down | left | right (initial facing)
    id: a                    # one letter a-h; marks this guard's cell in the grid
    move: still              # patrol | still

tools_given: []              # any of: shade_knife, hush_darts, ink_pots

intended_solution: >-        # prose: the route a human is supposed to find
  Step by step.
solution_inputs: tests/solutions/r01.inputs   # replay in hush input-script format
par_time_sec: 20             # target clear time for a competent player
ghost_possible: false        # can the room be cleared without any takedown?

must_not:                    # shortcuts that must NOT work (QA tests each)
  - Walking past the guard without being seen.
