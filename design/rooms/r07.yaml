# r07: floor 2, seq 7. See design/pillars.md (difficulty curve) and docs/engine_notes.md section 11 (AI rules).
id: r07
status: specified
seq: 7
floor: 2
teaches: >-
  Hush Darts: shoot an Unaware guard from beyond his sight range to put him to sleep (about 8
  s), then finish him with the Shade Knife.
layout: >-
  A one-cell corridor: a long vertical run up col 1 (rows 12 to 3), then east along row 3 to the
  exit (14,3). You start at the bottom (1,12) facing up. A still guard stands in the vertical
  run at (1,5) facing down at you, 7 cells away, just outside his 5-cell range. He blocks the
  corridor.
grid:
  - "################"
  - "################"
  - "################"
  - "#.............X#"
  - "#.##############"
  - "#a##############"
  - "#.##############"
  - "#.##############"
  - "#.##############"
  - "#.##############"
  - "#.##############"
  - "#.##############"
  - "#S##############"
  - "################"
lighting: dark

guards:
  - type: lantern_guard
    patrol: >-
      Stands still at (1,5) facing down the corridor towards the start; never moves. His cone
      reaches down to (1,10).
    facing: down
    id: a
    move: still

tools_given: [hush_darts]

intended_solution: >-
  1. You start at (1,12) facing up, 7 cells from the guard, outside his range. Select the Hush
  Darts (bow slot) and fire up the corridor: the dart puts him to sleep for about 8 s. Do not
  walk closer first (from (1,10) he sees you). 2. Walk up to (1,7)-(1,6) (about 1.5 cells below
  him: a sleeping guard is solid) and press B (Shade Knife): a sleeping guard dies to the knife.
  3. Walk up to (1,3), east along row 3 to the exit (14,3). All of it takes about 10 s, well
  inside his 8 s of sleep once the dart has landed.
solution_inputs: tests/solutions/r07.inputs
par_time_sec: 20
ghost_possible: false

must_not:
  - "Walking up the corridor towards the guard without firing must get you Suspicious by (1,10) and Alert 1 s later."
  - "A dart that hits an Alert guard must do nothing (no sleep)."
  - "The sleeping guard is a solid obstacle: you cannot walk through him in the 1-wide corridor; the knife must kill him."
  - "If you wait more than about 8 s after the dart he wakes up Unaware and faces you again."
