version: 1
rules: "Decision rules (applied in order; first match wins; overridable in docs/gfx/decisions_override.yaml):\n\
  \ 1. Blank in vanilla (7-byte empty stream)                      -> unused  (left untouched; no pixels to replace)\n\
  \ 2. Equipment / item sheets decoded by DecompressSword/Shield/LoadItemGFX -> reuse-as (Shade Knife / Hush Dart\
  \ / Ink Pot / props)\n 3. Link, font, HUD sheets                                       -> redraw  (P0)\n 4. Referenced\
  \ by an underworld tileset or underworld sprite set -> redraw  (P0 if used by >=10 underworld sets, else P1)\n\
  \ 5. Referenced only by routines/tables of the overworld, world map, intro, ending, mirror warp, followers ->\
  \ cut (engine task)\n 6. Referenced by an AA2 override row only (overworld/underworld unknown) -> redraw P1 (safe\
  \ default)\n 7. Not referenced anywhere                                      -> unused\nPriority: P0 needed for\
  \ the M1 test room (core dungeon tileset + sprites, Link, HUD, font), P1 MVP, P2 polish.\n"
