note: 'HUD / menu / text 2bpp palettes: [transparent, 1, 2, 3]. Colours are RGB hex; the build converts to BGR555. HUSH HUD groups 00 01 02 03 07 are the ones the in-room HUD uses, 05 = amber stealth-meter flash/blink (docs/gfx/hud_map.md); 04 06 and 08-0F are untouched placeholders (menu/text).'
groups:
  pal_hud_00:
    decision: redraw
    rom_rows: [$1BD660]
    colours:
    - ['000000', '98E8E0', '40B8B0', '0A1028']  # p0: Hush Dart counter icon (teal); empty item slots (F5 idx 3 = dark slot colour); inactive window frames
