placeholder_notice: PLACEHOLDER generated by tools/gfx_placeholder.py. Replace the pixels; keep size, grid and palette.
engine_layout: >-
  E4: the engine draws a guard from 14 blocks (src/hooks/guard_draw.asm; the full contract and the OAM composition are in docs/gfx/art_map.md
  section 5): head 16x16 at (X, Y-8), body 16x16 at (X, Y), lantern 8x8 beside the body; the figure is 16 wide x 24 tall, feet at the bottom of the
  body block. OAM tile = $40 + cell index (cell = row*16 + col of the 8x8 cell); a 16x16 block covers cells +0 +1 +16 +17. The rest of the sheet
  (px x 80..127, y 16..31 and x 64..79, y 24..31) is free. The labelled blocks are placeholders (head HD/HU/HS/HZ, body D1 D2 U1 U2 S1 S2 S3 BZ, lantern 0 1);
  replace the pixels freely, keep the block positions. `make gfx` would overwrite them with the old labelled grid.
